<!doctype html>
<meta charset="utf-8">
<title>enco-site icons</title>
<!-- Development aid: draws the site's icons and offers them for saving into public/. The tab icon is
     the lowercase e of enco on the dark paper with two concentric echo arcs in the accent colour;
     the home-screen icon condenses a single lowercase e out of the opening's falling ASCII rain
     using the page's own WebGL renderer. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=block">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 24px; background: #888; font: 13px monospace; }
  canvas { margin: 0 16px 16px 0; vertical-align: bottom; image-rendering: pixelated; }
  a { display: block; margin: 4px 0; }
</style>
<script type="module">
import { Field } from '../src/field.js';
import { textTexture } from '../src/text.js';

const TAB = [16, 32, 48];
const HOME = 180;
const FONT = '"IBM Plex Mono"';

document.documentElement.dataset.theme = 'dark';
const style = getComputedStyle(document.documentElement);
const color = (name) => style.getPropertyValue(name).trim();
const rgb = (name) => {
  const hex = color(name).replace('#', '');
  return [0, 2, 4].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);
};
const paper = color('--paper');
const ink = color('--ink');
const accent = color('--accent');
const rule = color('--rule');
await Promise.all(['400', '500'].map((weight) => document.fonts.load(`${weight} 48px ${FONT}`)));

function tabIcon(size) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const c = canvas.getContext('2d');
  const radius = Math.max(3, Math.round(size * 0.22));
  c.fillStyle = paper;
  c.beginPath();
  c.roundRect(0, 0, size, size, radius);
  c.fill();
  c.strokeStyle = rule;
  c.lineWidth = 1;
  c.beginPath();
  c.roundRect(0.5, 0.5, size - 1, size - 1, Math.max(2, radius - 0.5));
  c.stroke();

  const s = size / 64;
  c.save();
  c.scale(s, s);
  c.font = `500 46px ${FONT}`;
  const box = c.measureText('e');
  const width = box.actualBoundingBoxLeft + box.actualBoundingBoxRight;
  const height = box.actualBoundingBoxAscent + box.actualBoundingBoxDescent;
  const left = 24.5 - width / 2 + box.actualBoundingBoxLeft;
  const base = 32 + height / 2 - box.actualBoundingBoxDescent;
  c.fillStyle = ink;
  c.fillText('e', left, base);

  c.lineCap = 'round';
  c.strokeStyle = accent;
  c.lineWidth = size === 16 ? 4.2 : 3.2;
  c.beginPath();
  c.arc(27.5, 32, 18, -0.58, 0.58);
  c.stroke();

  c.globalAlpha = 0.48;
  c.lineWidth = size === 16 ? 3.8 : 2.6;
  c.beginPath();
  c.arc(27.5, 32, 25.5, -0.48, 0.48);
  c.stroke();
  c.restore();
  return canvas;
}

async function homeIcon(size) {
  const glCanvas = document.createElement('canvas');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  glCanvas.style.cssText = `position:fixed;left:-9999px;top:0;width:${size / dpr}px;height:${size / dpr}px`;
  document.body.appendChild(glCanvas);
  const field = Field.create(glCanvas, textTexture());
  const rows = 18;
  const cell = size / rows / dpr;
  const view = [size / dpr, size / dpr];
  field.resize(
    { width: cell * 0.54, height: cell, font: cell * 0.9 },
    `${FONT}, monospace`,
    { lines: ['e'], x: view[0] * 0.5, y: view[1] * 0.53, width: view[0] * 0.72, step: 0 }
  );
  const time = 25.52;
  const frame = {
    chapters: { from: 0, to: 1, mix: 0 },
    cells: { uTime: time, uBorn: time, uPocket: [0, 0, 0, 0] },
    present: { uPaper: rgb('--paper'), uInk: rgb('--ink'), uAccent: rgb('--accent') },
  };
  while (!field.render(frame)) await new Promise((resolve) => setTimeout(resolve, 10));
  field.render(frame);
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  canvas.getContext('2d').drawImage(glCanvas, 0, 0, size, size);
  glCanvas.remove();
  return canvas;
}

// An .ico holding PNG images, one per size.
async function ico(canvases) {
  const images = await Promise.all(canvases.map((canvas) =>
    new Promise((resolve) => canvas.toBlob(resolve, 'image/png')).then((blob) => blob.arrayBuffer())));
  const header = new DataView(new ArrayBuffer(6 + 16 * images.length));
  header.setUint16(2, 1, true);
  header.setUint16(4, images.length, true);
  let offset = header.byteLength;
  images.forEach((image, i) => {
    const entry = 6 + 16 * i;
    const size = canvases[i].width;
    header.setUint8(entry, size % 256);
    header.setUint8(entry + 1, size % 256);
    header.setUint16(entry + 4, 1, true);
    header.setUint16(entry + 6, 32, true);
    header.setUint32(entry + 8, image.byteLength, true);
    header.setUint32(entry + 12, offset, true);
    offset += image.byteLength;
  });
  return new Blob([header, ...images], { type: 'image/x-icon' });
}

const tab = TAB.map((size) => tabIcon(size));
const home = await homeIcon(HOME);
const files = {
  'favicon.ico': await ico(tab),
  'apple-touch-icon.png': await new Promise((resolve) => home.toBlob(resolve, 'image/png')),
};
document.body.append(...tab, home);
for (const [name, blob] of Object.entries(files)) {
  const link = document.createElement('a');
  link.download = name;
  link.href = URL.createObjectURL(blob);
  link.textContent = `Save ${name}`;
  document.body.append(link);
}
const read = (blob) => new Promise((resolve) => {
  const reader = new FileReader();
  reader.onload = () => resolve(reader.result);
  reader.readAsDataURL(blob);
});
window.icons = Object.fromEntries(await Promise.all(Object.entries(files).map(async ([name, blob]) => [name, await read(blob)])));
document.title = 'ready';
</script>
